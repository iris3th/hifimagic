# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build and release desktop apps

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create or update (for example v1.0.1)"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache downloaded build tools
        uses: actions/cache@v4
        with:
          path: |
            build/python.AppImage
            build/appimagetool.AppImage
          key: appimage-tools-${{ runner.os }}-v1

      - name: Build AppImage
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh > build.log 2>&1 || { tail -80 build.log; exit 1; }
          ls -lh HifiMagic-*.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HifiMagic-Linux-AppImage
          path: HifiMagic-*.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: build/macos/cpython-*.tar.gz
          key: macos-python-3.11.18-20261123

      - name: Build Apple Silicon app
        run: |
          chmod +x build-macos-app.sh
          ./build-macos-app.sh > build-macos.log 2>&1 || { tail -80 build-macos.log; exit 1; }
          ls -lh HifiMagic-*-apple-silicon.*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HifiMagic-macOS-arm64
          path: |
            HifiMagic-*-apple-silicon.zip
            HifiMagic-*-apple-silicon.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [appimage, macos]
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: HifiMagic-Linux-AppImage
          path: dist/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: HifiMagic-macOS-arm64
          path: dist/macos

      - name: Create checksums
        run: |
          # Plain filenames let people run `sha256sum -c SHA256SUMS-vX.Y.Z.txt`
          # straight from the folder where they downloaded the assets.
          (
            cd dist/linux && sha256sum HifiMagic-*.AppImage
            cd ../macos && sha256sum HifiMagic-*-apple-silicon.zip HifiMagic-*-apple-silicon.dmg
          ) > "dist/SHA256SUMS-${RELEASE_TAG}.txt"
          cat "dist/SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/linux/HifiMagic-*.AppImage
            dist/macos/HifiMagic-*-apple-silicon.zip
            dist/macos/HifiMagic-*-apple-silicon.dmg
            "dist/SHA256SUMS-${RELEASE_TAG}.txt"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "HifiMagic Media Manager $RELEASE_TAG" \
              --generate-notes
          fi
