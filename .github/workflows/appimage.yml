# SPDX-License-Identifier: AGPL-3.0-or-later
name: Build desktop apps

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache downloaded build tools
        uses: actions/cache@v4
        with:
          path: |
            build/python.AppImage
            build/appimagetool.AppImage
          key: appimage-tools-${{ runner.os }}-v1

      - name: Build AppImage
        run: |
          chmod +x build-appimage.sh
          ./build-appimage.sh > build.log 2>&1 || { tail -80 build.log; exit 1; }
          ls -lh HifiMagic-CXN100-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HifiMagic-Linux-AppImage
          path: HifiMagic-CXN100-x86_64.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify arm64 runner
        run: test "$(uname -m)" = arm64

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: build/macos/cpython-*.tar.gz
          key: macos-python-3.11.18-20261123

      - name: Build Apple Silicon app
        run: |
          chmod +x build-macos-app.sh
          ./build-macos-app.sh > build-macos.log 2>&1 || { tail -80 build-macos.log; exit 1; }
          ls -lh HifiMagic-CXN100-apple-silicon.*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HifiMagic-macOS-arm64
          path: |
            HifiMagic-CXN100-apple-silicon.zip
            HifiMagic-CXN100-apple-silicon.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: HifiMagic-Linux-AppImage
          path: dist/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: HifiMagic-macOS-arm64
          path: dist/macos

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/linux/HifiMagic-CXN100-x86_64.AppImage
            dist/macos/HifiMagic-CXN100-apple-silicon.zip
            dist/macos/HifiMagic-CXN100-apple-silicon.dmg
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "HifiMagic CXN100 controller $GITHUB_REF_NAME" \
              --generate-notes
          fi
